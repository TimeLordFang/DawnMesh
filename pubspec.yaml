name: dawn_mesh
description: "DawnMesh - Near-field voice intercom for Android, iOS, Windows, macOS, Linux."
publish_to: 'none'

# versionName 取 `+` 前半段，versionCode 取后半段。
# DawnMesh 0.1.0-dev.14 / versionCode 14
version: 0.1.0-dev.14+14

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  ffi: ^2.2.0
  cryptography: ^2.9.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
