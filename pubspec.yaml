name: dawn_mesh
description: "DawnMesh - decentralized near-field voice intercom for Android."
publish_to: 'none'

# versionName 取 `+` 前半段，versionCode 取后半段。
# DawnMesh 1.0.0-beta.7 / versionCode 31
version: 1.0.0-beta.8+32

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  http: ^1.6.0
  livekit_client: ^2.12.0
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^11.1.1
  image_picker: ^1.2.3
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
