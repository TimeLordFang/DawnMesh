name: dawn_mesh
description: "DawnMesh - decentralized near-field voice intercom for Android."
publish_to: 'none'

# versionName 取 `+` 前半段，versionCode 取后半段。
# DawnMesh 0.1.0-dev.16 / versionCode 16
version: 0.1.0-dev.16+16

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
