name: dawn_mesh
description: "DawnMesh - Near-field voice intercom for Android, iOS, Windows, macOS, Linux."
publish_to: 'none'

# versionName 取 `+` 前半段，versionCode 取后半段。
# DawnMesh 0.1.0-dev.9 / versionCode 9
version: 0.1.0-dev.9+9

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"
  ffi: ^2.1.2
  cryptography: ^2.9.0
  crypto: ^3.0.7
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0
  fake_async: ^1.3.2

flutter:
  uses-material-design: true
