# 主页文案。修改引号内的文字即可，保存后由 GitHub Pages 自动发布。
eyebrow: "DAWNMESH / 曙光之声"
headline: "越过地平线，"
headline_accent: "让声音相遇。"
intro: "山野、营地，或城市的另一端。用语音对讲连接附近同伴，也能通过自己的服务器，与远方的小组保持联系。"
download_label: "下载 Android 版"
download_note: "Android 8.0 及以上 · 开源应用"
story_title: "从身边出发，连向远方。"
story_intro: "选择适合当下的连接方式。附近通信不依赖互联网，远程交流使用你选择的服务。"
modes:
  - number: "01"
    label: "NEARBY"
    title: "没有网络，也能对讲"
    body: "通过共同 Wi-Fi、热点或兼容的蓝牙链路建房，与附近同伴通话。出发前，请在实际设备与环境中测试连接。"
    note: "附近房间 / 无需部署服务器"
  - number: "02"
    label: "HYBRID"
    title: "把附近的小组连起来"
    body: "融合房支持本地离线通信；当有成员联网并连接同一服务器时，可为远程同伴中继加密内容。"
    note: "跨网络中继 / 需要自部署服务器"
  - number: "03"
    label: "INTERNET"
    title: "让远方也在同一房间"
    body: "连接自部署的 DawnMesh Server 与 LiveKit，和跨网络的同伴进行实时语音交流。应用不内置公共服务器。"
    note: "公网房间 / 需要服务器与媒体服务"
features:
  - title: "按下，说话"
    body: "按住对讲，或切换自动发言。配合降噪，让交流更自然。"
  - title: "不止有声音"
    body: "分享文字和图片；按需开启语音留言，或使用独立的离线密封转交。"
  - title: "由你选择连接"
    body: "附近直连或自选服务器。没有内置广告、分析或遥测服务。"
faq:
  - question: "需要注册账号吗？"
    answer: "Android 客户端不要求注册开发者运营的账号。远程功能使用你自行配置的服务器，访问凭证取决于该服务器的设置。"
  - question: "Android 和 iPhone 能一起使用吗？"
    answer: "项目也有 iOS 客户端。兼容客户端可通过共同 Wi-Fi、热点或支持的蓝牙路径通信；Android Wi-Fi Direct 和苹果点对点 Wi-Fi 不能直接互联。"
  - question: "为什么附近设备发现需要权限？"
    answer: "不同 Android 版本要求附近 Wi-Fi、蓝牙或位置权限才能发现周围设备。位置权限用于设备发现，应用不据此建立位置轨迹。详见隐私政策。"
  - question: "蓝牙耳机可以和蓝牙房同时使用吗？"
    answer: "目前测试发现，同时使用可能导致严重断续。建议先断开蓝牙耳机，使用手机音频测试；表现因设备、耳机和系统而异。"
closing: "下一次出发，带上彼此的声音。"
