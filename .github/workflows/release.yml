name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0-dev.16"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DAWNMESH_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/dawnmesh-release.jks
      DAWNMESH_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      DAWNMESH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DAWNMESH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 25 LTS
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" ]]; then
            for candidate in "/usr/local/lib/android/sdk" "${HOME}/Android/Sdk"; do
              if [[ -d "${candidate}" ]]; then
                sdk_root="${candidate}"
                break
              fi
            done
          fi
          [[ -n "${sdk_root}" && -d "${sdk_root}" ]] || {
            echo "::error::Android SDK directory was not found"
            exit 1
          }
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager}" ]]; then
            sdkmanager="$(find "${sdk_root}/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          fi
          [[ -x "${sdkmanager}" ]] || {
            echo "::error::sdkmanager was not found under ${sdk_root}/cmdline-tools"
            exit 1
          }
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "$(dirname "${sdkmanager}")" >> "${GITHUB_PATH}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          echo "${sdk_root}/build-tools/36.1.0" >> "${GITHUB_PATH}"
          "${sdkmanager}" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Verify tag matches pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          version_name="${package_version%%+*}"
          version_code="${package_version##*+}"
          expected_tag="v${version_name}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match pubspec version ${version_name}. Expected ${expected_tag}."
            exit 1
          fi
          if [[ ! "${version_code}" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec versionCode must be an integer: ${version_code}"
            exit 1
          fi
          echo "name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "code=${version_code}" >> "${GITHUB_OUTPUT}"

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "${DAWNMESH_STORE_PASSWORD:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "${DAWNMESH_KEY_ALIAS:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEY_ALIAS"; exit 1; }
          [[ -n "${DAWNMESH_KEY_PASSWORD:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEY_PASSWORD"; exit 1; }
          mkdir -p "$(dirname "${DAWNMESH_KEYSTORE_PATH}")"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${DAWNMESH_KEYSTORE_PATH}"
          test -s "${DAWNMESH_KEYSTORE_PATH}"
          chmod 600 "${DAWNMESH_KEYSTORE_PATH}"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze and test
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze
          flutter test --concurrency=1
          ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug

      - name: Test native voice enhancement
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B /tmp/dawnmesh-native-test -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build /tmp/dawnmesh-native-test --parallel 2
          ctest --test-dir /tmp/dawnmesh-native-test --output-on-failure

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify and stage APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk_name="DawnMesh-${{ steps.version.outputs.name }}-release.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${apk_name}"
          "${ANDROID_SDK_ROOT}/build-tools/36.1.0/apksigner" verify --verbose --print-certs "dist/${apk_name}"
          "${ANDROID_SDK_ROOT}/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "dist/${apk_name}"
          python3 scripts/check_apk_elf_alignment.py "dist/${apk_name}"
          (
            cd dist
            sha256sum "${apk_name}" > "${apk_name}.sha256"
          )
          echo "apk=dist/${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/${apk_name}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="${{ steps.artifact.outputs.apk }}"
          checksum="${{ steps.artifact.outputs.checksum }}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${apk}" "${checksum}" --clobber
          else
            release_flags=(
              --verify-tag
              --title "DawnMesh ${{ steps.version.outputs.name }}"
            )
            notes_file="docs/RELEASE_${{ steps.version.outputs.name }}.md"
            if [[ -f "${notes_file}" ]]; then
              release_flags+=(--notes-file "${notes_file}")
            else
              release_flags+=(--generate-notes)
            fi
            if [[ "${{ steps.version.outputs.name }}" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" "${apk}" "${checksum}" "${release_flags[@]}"
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${DAWNMESH_KEYSTORE_PATH}"
