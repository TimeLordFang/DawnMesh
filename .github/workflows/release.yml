name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing candidate or stable tag, for example v1.2.3-rc.1"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DAWNMESH_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/dawnmesh-release.jks
      DAWNMESH_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      DAWNMESH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DAWNMESH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 27
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" ]]; then
            for candidate in "/usr/local/lib/android/sdk" "${HOME}/Android/Sdk"; do
              if [[ -d "${candidate}" ]]; then
                sdk_root="${candidate}"
                break
              fi
            done
          fi
          [[ -n "${sdk_root}" && -d "${sdk_root}" ]] || {
            echo "::error::Android SDK directory was not found"
            exit 1
          }
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager}" ]]; then
            sdkmanager="$(find "${sdk_root}/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          fi
          [[ -x "${sdkmanager}" ]] || {
            echo "::error::sdkmanager was not found under ${sdk_root}/cmdline-tools"
            exit 1
          }
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "$(dirname "${sdkmanager}")" >> "${GITHUB_PATH}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          echo "${sdk_root}/build-tools/37.0.0" >> "${GITHUB_PATH}"
          "${sdkmanager}" "cmdline-tools;23.0" "platform-tools"
          sdkmanager="${sdk_root}/cmdline-tools/23.0/bin/sdkmanager"
          echo "$(dirname "${sdkmanager}")" >> "${GITHUB_PATH}"
          "${sdkmanager}" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;4.1.2"

      - name: Install latest stable CMake
        run: ./scripts/setup-cmake-ci.sh

      - name: Validate release candidate or verified promotion
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_policy.py "$RELEASE_TAG" --output "$GITHUB_OUTPUT" \
            --verify-candidate --platform android --workflow 'Android release'

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "${DAWNMESH_STORE_PASSWORD:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "${DAWNMESH_KEY_ALIAS:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEY_ALIAS"; exit 1; }
          [[ -n "${DAWNMESH_KEY_PASSWORD:-}" ]] || { echo "::error::Required repository secret is missing: ANDROID_KEY_PASSWORD"; exit 1; }
          mkdir -p "$(dirname "${DAWNMESH_KEYSTORE_PATH}")"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${DAWNMESH_KEYSTORE_PATH}"
          test -s "${DAWNMESH_KEYSTORE_PATH}"
          chmod 600 "${DAWNMESH_KEYSTORE_PATH}"

      - name: Run the same release preflight as local builds
        run: ./scripts/preflight-release.sh

      - name: Stage preflight-verified APK and AAB
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk_name="DawnMesh-${{ steps.version.outputs.name }}-release.apk"
          aab_name="DawnMesh-${{ steps.version.outputs.name }}-release.aab"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${apk_name}"
          cp build/app/outputs/bundle/release/app-release.aab "dist/${aab_name}"
          (
            cd dist
            sha256sum "${apk_name}" > "${apk_name}.sha256"
            sha256sum "${aab_name}" > "${aab_name}.sha256"
          )
          echo "apk=dist/${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/${apk_name}.sha256" >> "${GITHUB_OUTPUT}"
          echo "aab=dist/${aab_name}" >> "${GITHUB_OUTPUT}"
          echo "aab_checksum=dist/${aab_name}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="${{ steps.artifact.outputs.apk }}"
          checksum="${{ steps.artifact.outputs.checksum }}"
          aab="${{ steps.artifact.outputs.aab }}"
          aab_checksum="${{ steps.artifact.outputs.aab_checksum }}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "${{ steps.version.outputs.prerelease }}" != true ]]; then
              echo "Stable release already exists; leave published assets unchanged" >&2
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" "${apk}" "${checksum}" "${aab}" "${aab_checksum}" --clobber
            gh release edit "${RELEASE_TAG}" --prerelease --latest=false
          else
            release_flags=(
              --verify-tag
              --title "DawnMesh ${RELEASE_TAG#v}"
            )
            notes_file="docs/RELEASE_${{ steps.version.outputs.name }}.md"
            if [[ -f "${notes_file}" ]]; then
              release_flags+=(--notes-file "${notes_file}")
            else
              release_flags+=(--generate-notes)
            fi
            if [[ "${{ steps.version.outputs.prerelease }}" == true ]]; then
              release_flags+=(--prerelease --latest=false)
            fi
            gh release create "${RELEASE_TAG}" "${apk}" "${checksum}" "${aab}" "${aab_checksum}" "${release_flags[@]}"
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${DAWNMESH_KEYSTORE_PATH}"
